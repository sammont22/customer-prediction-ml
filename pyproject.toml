[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "customer-prediction-ml"
version = "1.0.0"
description = "End-to-end machine learning project for bank customer subscription prediction."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuele Montinaro" },
]
keywords = [
    "machine-learning",
    "classification",
    "bank-marketing",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
]


[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "seaborn>=0.13,<1",
]


[project.scripts]
train-customer-prediction = "customer_prediction.train:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = [
    "src",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]